name: Stack Tomcat + Nginx - Construcción, análisis y pruebas

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "stack-tomcat/**"
      - ".github/workflows/stack-tomcat.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "stack-tomcat/**"
      - ".github/workflows/stack-tomcat.yml"

permissions:
  contents: read

jobs:
  stack:
    name: Construcción, análisis de seguridad y pruebas del stack
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: stack-tomcat

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # Compila la aplicación con Maven (dentro de Docker) y construye las dos imágenes
      - name: Construir imágenes
        run: docker compose build

      - name: Analizar la imagen de Tomcat (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'lab-tomcat:local'
          format: 'table'
          exit-code: '0'   # informativo
          severity: 'CRITICAL,HIGH'

      - name: Analizar la imagen de Nginx (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'lab-nginx:local'
          format: 'table'
          exit-code: '0'   # informativo
          severity: 'CRITICAL,HIGH'

      # --wait espera a que los contenedores estén sanos (HEALTHCHECK) y falla si no lo están
      - name: Levantar el stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Pruebas de humo
        run: bash tests/smoke.sh

      - name: Mostrar logs si algo ha fallado
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v
