worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile           on;
    keepalive_timeout  15;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---------------------------------------------------------------
    # Parámetros TLS (compartidos)
    # ---------------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # DNS interno de Docker. Se resuelve el nombre "tomcat" al hacer cada petición, de modo
    # que la sintaxis se puede validar en el build aunque el contenedor de Tomcat no exista.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------
    # HTTP (8080): solo redirige a HTTPS y expone /healthz
    # ---------------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # ---------------------------------------------------------------
    # HTTPS (8443): proxy inverso hacia Tomcat
    # ---------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /tmp/certs/server.crt;
        ssl_certificate_key /tmp/certs/server.key;

        # Cabeceras de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # Bloquear ficheros ocultos
        location ~ /\. {
            deny all;
        }

        location / {
            # Solo lectura: la aplicación únicamente atiende GET y HEAD
            limit_except GET HEAD {
                deny all;
            }

            set $tomcat_upstream http://tomcat:8080;
            proxy_pass $tomcat_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # Nginx es el borde: se sobrescribe la cabecera para que el cliente no pueda falsificarla
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
